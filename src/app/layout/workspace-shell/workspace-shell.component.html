<div class="shell" [class.sidebar-collapsed]="collapsed()" [class.mobile-nav-open]="mobileOpen()">
      @if (mobileOpen()) { <button class="mobile-nav-backdrop" type="button" aria-label="Close navigation" (click)="mobileOpen.set(false)"></button> }
      <aside class="sidebar" id="workspace-sidebar">
        <div class="sidebar-brand-row"><a class="brand" href="#" (click)="$event.preventDefault(); navRequested.emit('Overview')"><span class="brand-mark">d.</span><span class="brand-copy">dollareus<small>BUSINESS WORKSPACE</small></span></a><button class="collapse-sidebar" type="button" (click)="toggleCollapsed()" [attr.aria-label]="collapsed() ? 'Expand navigation' : 'Collapse navigation'" [attr.aria-expanded]="!collapsed()" title="Collapse navigation"><span class="material-icons">{{ collapsed() ? 'last_page' : 'first_page' }}</span></button></div>
        <label class="store-switch"><span class="store-avatar">{{ storeName().slice(0,1).toUpperCase() }}</span><span class="store-switch-fields"><b>{{ storeName() }}</b><select aria-label="Switch store location" [value]="selectedStoreId()" (change)="storeChangeRequested.emit($any($event.target).value)">@for (store of stores(); track store.id) { <option [value]="store.id">{{ store.locationName || store.city || store.locationSlug || store.slug || store.name }}</option> }</select></span><span class="chevron" aria-hidden="true">⌄</span></label>
        <button class="add-store-button" type="button" (click)="addStoreRequested.emit()" title="Add store"><span class="material-icons">add</span><span class="nav-label">Add store</span></button>
        <p class="nav-heading"><span class="nav-label">WORKSPACE</span></p>
        @for (item of primaryNav(); track item.label) {
          <button class="nav-item" [class.active]="activeNav() === item.label" [attr.aria-current]="activeNav() === item.label ? 'page' : null" [title]="collapsed() ? item.label : ''" (click)="navigate(item.label)" type="button"><span class="material-icons nav-symbol">{{ item.symbol }}</span><span class="nav-label">{{ item.label }}</span>@if(item.label === 'Orders' && ordersCount() > 0){<span class="count">{{ ordersCount() }}</span>}</button>
        }
        <p class="nav-heading channels-heading"><span class="nav-label">CHANNELS</span></p>
        @for (item of channelNav(); track item.label) {
          <button class="nav-item" [class.active]="activeNav() === item.label" [attr.aria-current]="activeNav() === item.label ? 'page' : null" [title]="collapsed() ? item.label : ''" (click)="navigate(item.label)" type="button"><span class="material-icons nav-symbol">{{ item.symbol }}</span><span class="nav-label">{{ item.label }}</span></button>
        }
        <div class="sidebar-bottom"><button class="nav-item" [class.active]="activeNav() === 'Settings'" [attr.aria-current]="activeNav() === 'Settings' ? 'page' : null" [title]="collapsed() ? 'Settings' : ''" type="button" (click)="navigate('Settings')"><span class="material-icons nav-symbol">settings</span><span class="nav-label">Settings</span></button><div class="user"><span class="user-avatar">D</span><span class="user-copy"><b>My account</b><small>Workspace access</small></span><button class="sign-out-button" type="button" aria-label="Sign out" title="Sign out" (click)="signOutRequested.emit()"><span class="material-icons">logout</span></button></div></div>
      </aside>
      <main class="main">
        <header class="topbar"><div class="topbar-left"><button class="mobile-menu-toggle" type="button" aria-label="Open navigation" aria-controls="workspace-sidebar" [attr.aria-expanded]="mobileOpen()" (click)="mobileOpen.update(v => !v)"><span class="material-icons">menu</span></button><div class="breadcrumbs"><span>{{ storeName() }}</span><span>/</span><b>{{ activeNav() }}</b></div></div><div class="top-actions"><button class="icon-button theme-toggle" type="button" (click)="toggleTheme()" [attr.aria-label]="dark() ? 'Switch to light theme' : 'Switch to dark theme'" [title]="dark() ? 'Light theme' : 'Dark theme'">{{ dark() ? '☼' : '◐' }}</button><label class="global-search"><span>⌕</span><input aria-label="Search products" placeholder="Search products..." [value]="search()" (input)="searchChangeRequested.emit($any($event.target).value)"><kbd>⌘ K</kbd></label></div></header>
        <div class="content">
        <ng-content />
        </div>
      </main>
      @if (toast()) { <div class="toast" role="status"><span>✓</span>{{ toast() }}<button type="button" aria-label="Dismiss" (click)="dismissToastRequested.emit()">×</button></div> }
    </div>
