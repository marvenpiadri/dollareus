name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, foundation/platform-architecture]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - name: Verify the production SSR server returns rendered HTML
        run: |
          pnpm serve:ssr > /tmp/dollareus-ssr.log 2>&1 &
          ssr_pid=$!
          trap 'kill "$ssr_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if node -e "fetch('http://127.0.0.1:4000/').then(async r => { const html = await r.text(); process.exit(r.ok && html.includes('<dlr-root') && html.includes('Dollareus') ? 0 : 1) }).catch(() => process.exit(1))"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/dollareus-ssr.log
            exit 1
          fi
      - run: pnpm api:typecheck

  api-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dollareus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dollareus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dollareus
      NODE_ENV: test
      RATE_LIMIT_MAX: 1000
      API_CREDENTIAL_DAILY_LIMIT: 8
      AUTH_PUBLIC_URL: http://localhost:4200
      AUTH_SUCCESS_REDIRECT_URL: http://localhost:4200
      CORS_ORIGINS: http://localhost:4200
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - name: Create a fresh test schema
        run: pnpm db:setup
      - name: Verify migration history and checksums
        run: pnpm db:status
      - name: Compare migrated PostgreSQL columns with the checked SQL snapshot
        run: pnpm db:schema-check
      - name: Verify the schema snapshot on a clean PostgreSQL database
        run: |
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres dollareus_snapshot
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d dollareus_snapshot -v ON_ERROR_STOP=1 -f apps/api/db/schema.sql
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d dollareus_snapshot -v ON_ERROR_STOP=1 -c "SELECT to_regclass('public.stores'), to_regclass('public.store_frontends'), to_regclass('public.auth_sessions'), to_regclass('public.inventory_movements'), to_regclass('public.inventory_reservations')"
      - name: Start API and run HTTP smoke checks
        run: |
          pnpm api:start > /tmp/dollareus-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if node -e "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/dollareus-api.log
            exit 1
          fi
          node apps/api/test/smoke.mjs
      - name: Build the production application for browser acceptance
        run: pnpm build
      - name: Install an isolated Playwright browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/dollareus-browser" playwright
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/dollareus-browsers" node "$RUNNER_TEMP/dollareus-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Run the restaurant workflow in a real Chromium browser
        env:
          PLAYWRIGHT_MODULE_URL: file:///home/runner/work/_temp/dollareus-browser/node_modules/playwright/index.mjs
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/work/_temp/dollareus-browsers
          DOLLAREUS_BROWSER_URL: http://127.0.0.1:4000
          DOLLAREUS_API_URL: http://127.0.0.1:3000
        run: |
          pnpm api:start > /tmp/dollareus-browser-api.log 2>&1 &
          api_pid=$!
          pnpm serve:ssr > /tmp/dollareus-browser-ssr.log 2>&1 &
          ssr_pid=$!
          trap 'kill "$api_pid" "$ssr_pid" 2>/dev/null || true' EXIT
          node apps/api/test/browser-acceptance.mjs
