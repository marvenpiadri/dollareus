name: Staging database verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-staging-database:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Require the staging database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add STAGING_DATABASE_URL as an environment secret in the GitHub staging environment before running this workflow."
            exit 1
          fi
      - run: pnpm install --no-frozen-lockfile
      - name: Apply pending migrations
        run: pnpm db:migrate
      - name: Verify migration history, checksums, and required schema version
        run: pnpm db:status
      - name: Verify API TypeScript contracts
        run: pnpm api:typecheck
