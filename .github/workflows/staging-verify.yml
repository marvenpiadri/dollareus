name: Staging database verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/staging-verify.yml'
      - 'apps/api/db/migrations/**'
      - 'apps/api/src/db/schema-version.ts'

permissions:
  contents: read

jobs:
  verify-staging-database:
    runs-on: ubuntu-latest
    environment: staging
    services:
      restore-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restore_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restore_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      NODE_ENV: test
      AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET || 'assets' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require a direct staging database connection
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add STAGING_DATABASE_URL as an environment secret in the GitHub staging environment before running this workflow."
            exit 1
          fi
          if node -e 'const u = new URL(process.env.DATABASE_URL); process.exit(u.hostname.includes("-pooler.") ? 1 : 0)'; then
            echo "Direct PostgreSQL connection detected."
          else
            echo "::error::STAGING_DATABASE_URL must use the direct Neon hostname, not the pooled -pooler hostname. The backup/restore rehearsal uses pg_dump and should not run through the transaction pooler."
            exit 1
          fi
      - run: pnpm install --no-frozen-lockfile
      - name: Inspect staging migration history before taking a backup
        run: pnpm db:status
      - name: Back up staging and prove the dump can be restored
        run: |
          set -euo pipefail
          dump_file="$RUNNER_TEMP/dollareus-staging-restore-check.dump"
          pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL" --file="$dump_file"
          test -s "$dump_file"
          pg_restore --exit-on-error --no-owner --no-privileges --dbname="postgres://postgres:postgres@127.0.0.1:5432/restore_verify" "$dump_file"
          migration_count="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d restore_verify -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.schema_migrations')"
          test "$migration_count" -gt 0
          required_tables="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d restore_verify -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('users','organizations','stores','products','pos_orders','inventory_movements','product_media')")"
          test "$required_tables" -eq 7
          echo "Restore rehearsal passed: $migration_count migration records and $required_tables required business tables restored."
          rm -f "$dump_file"
      - name: Verify persistent object storage with a put/read/delete round trip
        run: |
          set -euo pipefail
          for name in AWS_ENDPOINT_URL_S3 AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Configure $name as a secret in the GitHub staging environment before storage verification."
              exit 1
            fi
          done
          command -v aws >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y awscli; }
          region="${AWS_REGION:-us-east-2}"
          export AWS_CONFIG_FILE="$RUNNER_TEMP/aws-config"
          printf '[default]\ns3 =\n    addressing_style = path\n' > "$AWS_CONFIG_FILE"
          key="dollareus-healthchecks/staging-storage-probe-${GITHUB_RUN_ID}.txt"
          source_file="$RUNNER_TEMP/dollareus-storage-probe.txt"
          readback_file="$RUNNER_TEMP/dollareus-storage-readback.txt"
          printf 'Dollareus storage round-trip %s\n' "$GITHUB_RUN_ID" > "$source_file"
          cleanup() {
            aws --endpoint-url "$AWS_ENDPOINT_URL_S3" --region "$region" s3api delete-object --bucket "$AWS_S3_BUCKET" --key "$key" >/dev/null 2>&1 || true
            rm -f "$source_file" "$readback_file"
          }
          trap cleanup EXIT
          aws --endpoint-url "$AWS_ENDPOINT_URL_S3" --region "$region" s3api put-object --bucket "$AWS_S3_BUCKET" --key "$key" --body "$source_file" >/dev/null
          aws --endpoint-url "$AWS_ENDPOINT_URL_S3" --region "$region" s3api get-object --bucket "$AWS_S3_BUCKET" --key "$key" "$readback_file" >/dev/null
          cmp "$source_file" "$readback_file"
          echo "Object storage round-trip passed for private bucket: $AWS_S3_BUCKET."
      - name: Apply pending migrations only after backup, restore, and storage verification
        run: pnpm db:migrate
      - name: Verify migration history, checksums, and required schema version
        run: pnpm db:status
      - name: Verify API TypeScript contracts
        run: pnpm api:typecheck
